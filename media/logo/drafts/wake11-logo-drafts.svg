<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300">
  <defs>
    <linearGradient id="sun" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF5A1F"/>
      <stop offset="1" stop-color="#FFC247"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2F7BFF"/>
      <stop offset="1" stop-color="#6CC0FF"/>
    </linearGradient>
    <clipPath id="sky"><rect x="0" y="0" width="512" height="352"/></clipPath>
    <clipPath id="tileD"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
    <!-- a "1": bar standing on y=0, pointing up, with a flag at the top -->
    <path id="one" d="M -22 0 L 22 0 L 22 -150 L -10 -150 L -62 -114 L -50 -92 L -22 -110 Z"/>
  </defs>

  <rect width="1200" height="1300" fill="#1C1C1F"/>

  <!-- A · 11 on a clock face (11 o'clock tick lit) -->
  <g transform="translate(64,64)">
    <rect width="512" height="512" rx="112" fill="#0B0B0D"/>
    <circle cx="256" cy="256" r="182" fill="none" stroke="#FF8A3D" stroke-width="24"/>
    <line x1="256.0" y1="106.0" x2="256.0" y2="128.0" stroke="#5A5A62" stroke-width="6" stroke-linecap="round"/><line x1="331.0" y1="126.1" x2="325.0" y2="136.5" stroke="#5A5A62" stroke-width="6" stroke-linecap="round"/><line x1="385.9" y1="181.0" x2="375.5" y2="187.0" stroke="#5A5A62" stroke-width="6" stroke-linecap="round"/><line x1="406.0" y1="256.0" x2="384.0" y2="256.0" stroke="#5A5A62" stroke-width="6" stroke-linecap="round"/><line x1="385.9" y1="331.0" x2="375.5" y2="325.0" stroke="#5A5A62" stroke-width="6" stroke-linecap="round"/><line x1="331.0" y1="385.9" x2="325.0" y2="375.5" stroke="#5A5A62" stroke-width="6" stroke-linecap="round"/><line x1="256.0" y1="406.0" x2="256.0" y2="384.0" stroke="#5A5A62" stroke-width="6" stroke-linecap="round"/><line x1="181.0" y1="385.9" x2="187.0" y2="375.5" stroke="#5A5A62" stroke-width="6" stroke-linecap="round"/><line x1="126.1" y1="331.0" x2="136.5" y2="325.0" stroke="#5A5A62" stroke-width="6" stroke-linecap="round"/><line x1="106.0" y1="256.0" x2="128.0" y2="256.0" stroke="#5A5A62" stroke-width="6" stroke-linecap="round"/><line x1="126.1" y1="181.0" x2="136.5" y2="187.0" stroke="#5A5A62" stroke-width="6" stroke-linecap="round"/><line x1="181.0" y1="126.1" x2="187.0" y2="136.5" stroke="#FF8A3D" stroke-width="12" stroke-linecap="round"/>
    <g fill="#FFFFFF">
      <use href="#one" transform="translate(212,330) scale(1.0,1.0)"/>
      <use href="#one" transform="translate(304,330) scale(1.0,1.0)"/>
    </g>
  </g>
  <text x="320" y="626" fill="#D8D8DC" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle">A · 11 on a clock face</text>

  <!-- B · Sunrise behind 11 -->
  <g transform="translate(624,64)">
    <rect width="512" height="512" rx="112" fill="#0B0B0D"/>
    <g clip-path="url(#sky)">
      <circle cx="256" cy="352" r="170" fill="url(#sun)"/>
    </g>
    <rect x="72" y="350" width="368" height="10" rx="5" fill="#FF8A3D"/>
    <rect x="132" y="384" width="248" height="8" rx="4" fill="#FF8A3D" opacity="0.6"/>
    <rect x="196" y="414" width="120" height="6" rx="3" fill="#FF8A3D" opacity="0.35"/>
    <g fill="#FFFFFF" stroke="#0B0B0D" stroke-width="14" paint-order="stroke" stroke-linejoin="round">
      <use href="#one" transform="translate(206,342) scale(1.25,1.25)"/>
      <use href="#one" transform="translate(316,342) scale(1.25,1.25)"/>
    </g>
  </g>
  <text x="880" y="626" fill="#D8D8DC" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle">B · Sunrise behind 11</text>

  <!-- C · Bell with 11 cut out -->
  <g transform="translate(64,696)">
    <rect width="512" height="512" rx="112" fill="#FF8A3D"/>
    <path d="M 256 92 C 268 92 276 100 276 112 L 276 120
             C 344 132 372 190 372 262 L 372 322 C 372 350 392 368 412 380 L 412 396
             L 100 396 L 100 380 C 120 368 140 350 140 322 L 140 262
             C 140 190 168 132 236 120 L 236 112 C 236 100 244 92 256 92 Z" fill="#0B0B0D"/>
    <circle cx="256" cy="428" r="28" fill="#0B0B0D"/>
    <path d="M 84 190 C 66 222 66 270 84 302" fill="none" stroke="#0B0B0D" stroke-width="16" stroke-linecap="round"/>
    <path d="M 428 190 C 446 222 446 270 428 302" fill="none" stroke="#0B0B0D" stroke-width="16" stroke-linecap="round"/>
    <g fill="#FF8A3D">
      <use href="#one" transform="translate(216,352) scale(1.05,1.05)"/>
      <use href="#one" transform="translate(304,352) scale(1.05,1.05)"/>
    </g>
  </g>
  <text x="320" y="1258" fill="#D8D8DC" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle">C · Alarm bell, 11 cut out</text>

  <!-- D · Current style (crossed bars on a light grid) made into 11 -->
  <g transform="translate(624,696)">
    <g clip-path="url(#tileD)">
      <rect width="512" height="512" fill="#FFFFFF"/>
      <g stroke="#E6E8EC" stroke-width="3">
        <path d="M -512 0 L 512 1024 M -384 0 L 640 1024 M -256 0 L 768 1024 M -128 0 L 896 1024 M 0 0 L 1024 1024 M 128 0 L 1152 1024 M 256 0 L 1280 1024"/>
        <path d="M 1024 0 L 0 1024 M 896 0 L -128 1024 M 768 0 L -256 1024 M 640 0 L -384 1024 M 512 0 L -512 1024 M 384 0 L -640 1024 M 256 0 L -768 1024"/>
      </g>
    </g>
    <!-- orange crossing bar behind, like the original mark's cross -->
    <rect x="-150" y="-26" width="300" height="52" rx="26" fill="#FF8A3D" transform="translate(256,300) rotate(-35)"/>
    <g fill="url(#blue)">
      <use href="#one" transform="translate(206,396) skewX(-12) scale(1.35,1.35)"/>
      <use href="#one" transform="translate(318,396) skewX(-12) scale(1.35,1.35)"/>
    </g>
  </g>
  <text x="880" y="1258" fill="#D8D8DC" font-family="Segoe UI, Arial, sans-serif" font-size="30" text-anchor="middle">D · Current style, now with 11</text>
</svg>
